version: 2.1

jobs:
  test:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: "Checkout over HTTPS"
          command: |
            set -eu
            : "${CIRCLE_PROJECT_USERNAME:?CIRCLE_PROJECT_USERNAME is required}"
            : "${CIRCLE_PROJECT_REPONAME:?CIRCLE_PROJECT_REPONAME is required}"
            : "${CIRCLE_SHA1:?CIRCLE_SHA1 is required}"
            # This public repository does not require a CircleCI SSH checkout key.
            git init .
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            GIT_TERMINAL_PROMPT=0 git fetch origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
      - run:
          name: "Update apt-get"
          command: "sudo apt-get update"
      - run:
          name: "Install Prerequests"
          command: "sudo apt-get install -y clang wget"
      - run:
          name: "Download .NET Core install script"
          command: "wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh"
      - run:
          name: "chmod .NET Core install script"
          command: "chmod +x ./dotnet-install.sh"
      - run:
          name: "Install .NET Core SDK 7.0"
          command: "./dotnet-install.sh --channel 7.0"
      - run:
          name: "Build and Test micro MSX2+"
          command: "export PATH=/home/circleci/.dotnet:$PATH && make"

workflows:
  test-workflow:
    jobs:
      - test
